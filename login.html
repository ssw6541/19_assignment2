<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>로그인 데모 | DRAW:ON</title>
    <link rel="icon" type="image/svg+xml" href="img2/favicon.svg" />
    <link rel="stylesheet" href="platform.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a class="logo" href="index.html"
          >DRAW<span>:</span>ON<small>ILLUSTRATION ACADEMY</small></a
        ><a class="login-link" href="index.html">← 홈으로</a>
      </div>
    </header>
    <main class="login-layout">
      <div class="login-art">
        <img
          src="img2/dandelion_tea-couple-7726523_1920.png"
          alt="따뜻한 색감의 일러스트"
        />
        <div>
          <span>YOUR NEXT DRAWING</span>
          <h2>당신의 다음 그림을<br />함께합니다.</h2>
        </div>
      </div>
      <form class="login-form" action="login.html">
        <a class="logo" href="index.html">DRAW<span>:</span>ON</a>
        <h1>다시 만나 반가워요.</h1>
        <p>나의 그림 여정을 이어가세요.</p>
        <div class="demo-note">
          로그인 시연 화면입니다. 입력값은 전송·저장되지 않습니다.
        </div>
        <label
          >이메일<input
            type="email"
            autocomplete="off"
            placeholder="name@example.com" /></label
        ><label
          >비밀번호<input
            type="password"
            autocomplete="new-password"
            placeholder="비밀번호 입력" /></label
        ><button class="button" type="button">로그인 시연 화면입니다</button>
        <p>실제 인증 기능은 제공되지 않습니다.</p>
        <a href="classes.html">클래스 먼저 둘러보기 →</a>
      </form>
    </main>
  </body>
</html>
